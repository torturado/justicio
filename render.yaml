previewsEnabled: true
services:
  # A Docker web service
  - type: web
    name: ia-boe
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch && pip install -r requirements.txt
    startCommand: uvicorn src.service.main:APP --host 0.0.0.0 --port 10000 --workers 1 --timeout-keep-alive 125 --log-level info
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
