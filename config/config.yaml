# RecursiveCharacterTextSplitter, used for documents without a legal structure (daily bulletins)
chunk_size: 2000
chunk_overlap: 200

admin_email: bukosabino@gmail.com

# Local embeddings
embeddings_model_name: BAAI/bge-m3
embeddings_dimensions: 1024

# Hybrid search: candidates retrieved by each search (dense and BM25) before the fusion
prefetch_limit: 40
reranker_candidates: 40
top_k_results: 8
reranker_model_name: BAAI/bge-reranker-v2-m3
reranker_device: cpu
reranker_max_length: 512
reranker_batch_size: 8

# Prompts
prompt_system: |
  Responde en español y utiliza únicamente los fragmentos oficiales que se proporcionan. Si no contienen información suficiente, indícalo claramente y no completes la respuesta con conocimiento externo ni inferencias jurídicas.
  Distingue el texto de la norma de una valoración sobre su aplicación a un caso concreto. No afirmes que una disposición sigue vigente en una fecha determinada si los datos de la fuente no lo acreditan.

prompt_system_context: |
  El contexto incluye la norma, el artículo o apartado y, cuando existe, su identificador BOE, fecha de versión y enlace.
  Cita cada afirmación jurídica con los números de fragmento correspondientes, por ejemplo [2]. No inventes referencias ni uses un número de cita que no aparezca en el contexto.
  Resume con tus propias palabras; no copies párrafos completos. Si se solicita una norma, artículo o ámbito territorial que no aparezca en las fuentes, dilo expresamente y no lo sustituyas por otra norma.
  Si aparecen procedimientos con el mismo nombre en jurisdicciones distintas, sepáralos e identifica la norma y el ámbito de cada uno; no combines sus requisitos, límites ni documentos. Para una pregunta genérica sobre el proceso monitorio, responde primero sobre el proceso civil de la Ley de Enjuiciamiento Civil y solo añade el monitorio laboral como vía distinta si las fuentes lo respaldan.

# Qdrant
collections:
  - justicio
  - bocm
  - bopz
  - bopv
  - boja
  - boa

collection_scopes:
  justicio: Legislación estatal consolidada del BOE
  bocm: Boletín Oficial de la Comunidad de Madrid
  bopz: Boletín Oficial de la Provincia de Zaragoza
  bopv: Boletín Oficial del País Vasco
  boja: Boletín Oficial de la Junta de Andalucía
  boa: Boletín Oficial de Aragón

# Gemini LLM. Google recommends the default temperature (1.0) for Gemini 3 models.
llm_model_name: gemini-3.5-flash-lite
seed: 42
# Includes the thinking tokens
max_output_tokens: 4096
